<body>
    <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Store / Restaurant</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<style>
  /* ============================================================
     FLUID SCALE
     ============================================================ */
  :root {
    --s1: clamp(3px, .30vw + 2px, 6px);
    --s2: clamp(5px, .45vw + 3px, 9px);
    --s3: clamp(8px, .70vw + 5px, 13px);
    --s4: clamp(11px, 1vw + 7px, 18px);

    --r1: clamp(5px, .35vw + 3px, 8px);
    --r2: clamp(8px, .60vw + 5px, 12px);
    --r3: clamp(11px, .80vw + 7px, 15px);

    --fs-xs:   clamp(.60rem, .15vw + .56rem, .70rem);
    --fs-sm:   clamp(.70rem, .20vw + .62rem, .82rem);
    --fs-md:   clamp(.80rem, .25vw + .70rem, .92rem);
    --fs-lg:   clamp(.92rem, .35vw + .78rem, 1.05rem);
    --fs-xl:   clamp(1.05rem, .55vw + .85rem, 1.35rem);
    --fs-hero: clamp(1.20rem, 1.6vw + .75rem, 1.9rem);
    --fs-num:  clamp(1.25rem, .9vw + .95rem, 1.6rem);

    --bg:#fff8f0; --surface:#fff; --border:#f0ddc9; --border2:#e6d3c2;
    --accent:#c96a3a; --accent2:#b05a2e; --accent3:#8a4b28;
    --text:#3b2a20; --muted:#a08a78;
    --success:#4c8b52; --success2:#3f7745;
    --wa:#25d366; --wa2:#1ebe5a;
    --danger:#c0392b;
    --tint:#fdf3ea; --tint2:#f3e4d6; --tint3:#fdf7f1;
    --sh1: 0 2px 8px rgba(90,60,40,.06);
    --sh2: 0 3px 12px rgba(90,60,40,.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; padding: var(--s4);
  }

  /* ---------- Header ---------- */
  header { text-align: center; margin-bottom: var(--s4); }
  header h1 { font-size: var(--fs-hero); letter-spacing: -.5px; }
  .datetime { font-size: var(--fs-xs); color: var(--muted); margin-top: var(--s1); font-weight: 600; }

  .controls {
    display: flex; flex-wrap: wrap; gap: var(--s2);
    justify-content: center; align-items: center;
    margin-top: var(--s3);
  }
  .pill {
    display: inline-flex; align-items: center; gap: var(--s1);
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 999px; padding: var(--s2) var(--s3);
    font-size: var(--fs-sm); color: var(--accent);
    box-shadow: var(--sh1); font-weight: 700;
  }
  .pill select {
    font: inherit; font-weight: 700; color: var(--accent);
    background: transparent; border: none; outline: none; cursor: pointer;
  }
  .icon-btn {
    font-family: inherit; cursor: pointer; transition: background .15s;
    border: 1px solid var(--border); background: var(--surface);
    width: clamp(32px, 3vw, 40px); height: clamp(32px, 3vw, 40px);
    border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
    font-size: var(--fs-md); box-shadow: var(--sh1); position: relative;
  }
  .icon-btn:hover { background: var(--tint); }
  .alert-badge {
    position: absolute; top: -3px; right: -3px;
    background: var(--danger); color: #fff;
    min-width: 18px; height: 18px; border-radius: 999px;
    font-size: var(--fs-xs); font-weight: 800;
    display: inline-flex; align-items: center; justify-content: center;
    padding: 0 var(--s1); border: 2px solid var(--bg);
  }
  .alert-badge.zero { display: none; }

  /* ---------- Promo strip ---------- */
  .promo-strip {
    display: flex; gap: var(--s2); overflow-x: auto;
    padding: var(--s2) 0; margin: 0 auto var(--s3);
    max-width: 1500px; scrollbar-width: none;
  }
  .promo-strip::-webkit-scrollbar { display: none; }
  .promo-chip {
    flex: 0 0 auto;
    background: linear-gradient(135deg, #ffe9b0, #ffd27a);
    color: #6a4400; border-radius: 999px;
    padding: var(--s2) var(--s3); font-size: var(--fs-sm); font-weight: 700;
    box-shadow: 0 2px 10px rgba(200,140,20,.18);
    display: flex; align-items: center; gap: var(--s1); white-space: nowrap;
  }

  /* ---------- Layout ---------- */
  main {
    display: grid;
    grid-template-columns: 1fr clamp(240px, 22vw, 340px);
    gap: var(--s4); max-width: 1500px; margin: 0 auto;
  }

  /* ---------- Menu ---------- */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(clamp(150px, 15vw, 210px), 1fr));
    gap: var(--s3); align-content: start;
  }
  .card {
    background: var(--surface); border-radius: var(--r3); padding: var(--s2); text-align: center;
    box-shadow: var(--sh2);
    display: flex; flex-direction: column; align-items: center; gap: var(--s2);
  }
  @media (hover: hover) {
    .card { transition: transform .12s, box-shadow .12s; }
    .card:hover { transform: translateY(-2px); box-shadow: var(--sh1), 0 6px 16px rgba(90,60,40,.12); }
  }
  .card .media {
    width: 100%; aspect-ratio: 1; border-radius: var(--r2);
    background: var(--tint); display: flex; align-items: center; justify-content: center;
    overflow: hidden; position: relative;
  }
  .card .media.has-photos { cursor: zoom-in; }
  .card .media img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card .media .emoji { font-size: var(--fs-hero); line-height: 1; }
  .photo-count {
    position: absolute; right: var(--s1); bottom: var(--s1);
    background: rgba(0,0,0,.62); color: #fff;
    font-size: var(--fs-xs); font-weight: 700;
    padding: 1px var(--s2); border-radius: 999px;
  }
  .card .name {
    font-size: var(--fs-md); font-weight: 600; line-height: 1.25;
    min-height: 2.4em; display: flex; align-items: center; justify-content: center;
  }
  .card .desc {
    font-size: var(--fs-xs); color: var(--muted); line-height: 1.3;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden; min-height: 2.4em;
  }
  .card .price { font-size: var(--fs-sm); font-weight: 700; color: var(--accent); line-height: 1.35; }
  .card .price .q-sep { color: var(--muted); font-weight: 400; }
  .card-btns { display: flex; gap: var(--s1); width: 100%; }
  .card-btns button {
    flex: 1; padding: var(--s2) var(--s1);
    font-size: var(--fs-sm); font-weight: 700; font-family: inherit;
    color: #fff; background: var(--accent); border: none;
    border-radius: var(--r2); cursor: pointer; transition: background .15s;
  }
  .card-btns button:hover { background: var(--accent2); }
  .card-btns button:active { transform: scale(.97); }
  .card-btns .q-btn { background: var(--accent3); }
  .card-btns .q-btn:hover { background: #6f3b1e; }

  .empty-menu {
    grid-column: 1 / -1; background: var(--surface);
    border-radius: var(--r3); padding: var(--s4);
    text-align: center; color: var(--muted);
    box-shadow: var(--sh2); font-size: var(--fs-md);
  }

  /* ---------- Cart ---------- */
  aside {
    background: var(--surface); border-radius: var(--r3); padding: var(--s3);
    box-shadow: var(--sh2); align-self: start; position: sticky; top: var(--s4);
  }
  #cart-items {
    list-style: none; display: flex; flex-direction: column;
    gap: var(--s3); max-height: 40vh; overflow-y: auto; margin-bottom: var(--s3);
  }
  .ci-name { font-size: var(--fs-sm); font-weight: 600; margin-bottom: var(--s1); line-height: 1.3; }
  .q-badge {
    display: inline-block; background: var(--tint2); color: var(--accent3);
    font-size: var(--fs-xs); font-weight: 800;
    padding: 0 var(--s2); border-radius: 999px;
  }
  .ci-row { display: flex; align-items: center; justify-content: space-between; gap: var(--s2); }
  .qty { display: flex; align-items: center; gap: var(--s2); }
  .qty button {
    width: clamp(26px, 2.4vw, 32px); height: clamp(26px, 2.4vw, 32px);
    font-size: var(--fs-lg); font-weight: 700; font-family: inherit;
    border: 1px solid var(--border2); background: var(--tint);
    color: var(--accent3); border-radius: var(--r1); cursor: pointer;
  }
  .qty button:hover { background: var(--tint2); }
  .qty span { font-weight: 700; min-width: 1.4em; text-align: center; font-size: var(--fs-md); }
  .ci-price { font-weight: 700; color: var(--accent); font-size: var(--fs-md); }
  .total {
    display: flex; justify-content: space-between;
    font-size: var(--fs-lg); font-weight: 700;
    border-top: 2px solid var(--tint2); padding-top: var(--s3);
  }
  .total span { color: var(--accent); }

  #order-btn, #whatsapp-btn {
    width: 100%; padding: var(--s3);
    font-size: var(--fs-md); font-weight: 700; font-family: inherit;
    border: none; border-radius: var(--r2); cursor: pointer;
    transition: background .15s; color: #fff;
  }
  #order-btn { background: var(--success); margin-top: var(--s3); }
  #order-btn:hover { background: var(--success2); }
  #whatsapp-btn { background: var(--wa); margin-top: var(--s2); }
  #whatsapp-btn:hover { background: var(--wa2); }
  #order-btn:active, #whatsapp-btn:active { transform: scale(.98); }

  #status {
    text-align: center; margin-top: var(--s3);
    min-height: 1.2em; font-weight: 600;
    color: var(--success); font-size: var(--fs-xs); line-height: 1.4;
  }
  #status a { color: var(--wa2); font-weight: 700; }

  .drawer-close, .drawer-backdrop, .mobile-bar { display: none; }

  /* ---------- Modals ---------- */
  .modal-backdrop {
    display: none; position: fixed; inset: 0;
    background: rgba(40,25,15,.55); backdrop-filter: blur(3px);
    z-index: 1000; align-items: center; justify-content: center;
    padding: var(--s3);
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: var(--surface); border-radius: var(--r3);
    padding: var(--s4); max-width: 440px; width: 100%;
    box-shadow: 0 20px 50px rgba(0,0,0,.25);
    max-height: 92vh; overflow-y: auto;
  }
  .modal h3 { font-size: var(--fs-lg); margin-bottom: var(--s3); }
  .modal input, .modal textarea, .modal select {
    width: 100%; padding: var(--s3); font-size: var(--fs-md);
    font-family: inherit; border: 2px solid var(--border2);
    border-radius: var(--r2); outline: none; background: var(--surface);
    transition: border-color .15s;
  }
  .modal input:focus, .modal textarea:focus, .modal select:focus { border-color: var(--accent); }
  .modal input.error { border-color: var(--danger); background: #fff5f3; }
  .modal textarea { resize: vertical; min-height: 70px; }
  .modal label { display: block; font-size: var(--fs-sm); font-weight: 600; margin-bottom: var(--s1); color: #5a3e2e; }
  .modal .error-msg { color: var(--danger); font-size: var(--fs-xs); margin-top: var(--s1); min-height: 1.1em; }
  .modal .field { margin-bottom: var(--s3); }

  .amount {
    font-size: var(--fs-num); font-weight: 800; color: var(--accent);
    text-align: center; margin-bottom: var(--s3); letter-spacing: -.5px;
  }

  .net-tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--s1); margin-bottom: var(--s3); }
  .net-tab {
    padding: var(--s2) var(--s1); font-family: inherit; font-size: var(--fs-xs); font-weight: 700;
    border: 2px solid var(--border); background: var(--surface); color: var(--muted);
    border-radius: var(--r2); cursor: pointer; transition: all .15s;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
  }
  .net-tab .net-icon { font-size: var(--fs-md); line-height: 1; }
  .net-tab:hover { background: var(--tint3); }
  .net-tab.active[data-net="Airtel"] { background: #fde8e8; border-color: #e40000; color: #c40000; }
  .net-tab.active[data-net="MTN"]    { background: #fff7d6; border-color: #ffcc00; color: #8a6d00; }
  .net-tab.active[data-net="USSD"]   { background: #e8f0ff; border-color: #2c7be5; color: #1a5fc0; }
  .net-tab.active[data-net="Phone"]  { background: #e8f6ea; border-color: #4c8b52; color: #3f7745; }

  .network-hint {
    background: var(--tint3); border: 1px dashed var(--border2);
    border-radius: var(--r2); padding: var(--s2) var(--s3);
    font-size: var(--fs-xs); color: #6b4a34; margin-bottom: var(--s3); line-height: 1.5;
  }
  .network-hint code {
    background: var(--surface); padding: 1px var(--s1);
    border-radius: var(--r1); font-weight: 700; color: var(--accent);
    font-size: var(--fs-sm); word-break: break-all;
  }

  .checkbox-row {
    display: flex; align-items: center; gap: var(--s2);
    font-size: var(--fs-sm); color: #5a3e2e;
    padding: var(--s2) 0; cursor: pointer; user-select: none;
  }
  .checkbox-row input[type="checkbox"] {
    width: 18px; height: 18px; accent-color: var(--accent);
    flex: 0 0 auto; cursor: pointer;
  }

  .modal .actions { display: flex; gap: var(--s2); margin-top: var(--s3); }
  .modal .actions button {
    flex: 1; padding: var(--s3);
    font-size: var(--fs-md); font-weight: 700; font-family: inherit;
    border: none; border-radius: var(--r2); cursor: pointer; transition: background .15s;
  }
  .btn-cancel { background: var(--tint2); color: #6b4a34; }
  .btn-cancel:hover { background: #ebd5c1; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent2); }
  .btn-primary:disabled { background: #d9b8a0; cursor: not-allowed; }
  .btn-wa { background: var(--wa); color: #fff; }
  .btn-wa:hover { background: var(--wa2); }
  .btn-reset { background: #fbe3dd; color: var(--danger); }
  .btn-reset:hover { background: #f7d2ca; }
  .btn-sm {
    padding: var(--s2) var(--s3); font-size: var(--fs-xs); font-weight: 700;
    font-family: inherit; border: none; border-radius: var(--r1);
    cursor: pointer; transition: background .15s; white-space: nowrap;
  }

  .pay-progress { text-align: center; padding: var(--s2) 0; display: none; }
  .pay-progress.visible { display: block; }
  .spinner {
    width: 30px; height: 30px; border: 3px solid var(--tint2);
    border-top-color: var(--accent); border-radius: 50%;
    margin: 0 auto var(--s2); animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- Lock modal ---------- */
  #lock-modal { z-index: 1100; }
  .lock-modal { max-width: 380px; }
  .lock-modal input {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: var(--fs-xl); letter-spacing: 6px; text-align: center;
  }

  /* ---------- Seller Console ---------- */
  .console-modal { max-width: 820px; }
  .console-tabs {
    display: flex; gap: var(--s1); margin-bottom: var(--s3);
    overflow-x: auto; padding-bottom: var(--s1); scrollbar-width: thin;
  }
  .console-tab {
    flex: 0 0 auto; padding: var(--s2) var(--s3);
    font-family: inherit; font-size: var(--fs-sm); font-weight: 700;
    border: none; background: var(--tint); color: var(--muted);
    border-radius: var(--r2); cursor: pointer; transition: all .15s;
    display: flex; align-items: center; gap: var(--s1);
  }
  .console-tab.active { background: var(--accent); color: #fff; }
  .console-tab .tab-badge {
    background: var(--danger); color: #fff;
    min-width: 16px; height: 16px; border-radius: 999px;
    font-size: 10px; font-weight: 800;
    display: inline-flex; align-items: center; justify-content: center;
    padding: 0 4px;
  }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  .list-empty { text-align: center; color: var(--muted); font-size: var(--fs-sm); padding: var(--s4) var(--s3); }

  .mg-row {
    display: flex; flex-direction: column; gap: var(--s2);
    background: var(--tint3); border: 1px solid var(--tint2);
    border-radius: var(--r2); padding: var(--s2); margin-bottom: var(--s2);
  }
  .mg-photos { display: flex; gap: var(--s2); flex-wrap: wrap; }
  .thumb {
    position: relative;
    width: clamp(44px, 5vw, 56px); height: clamp(44px, 5vw, 56px);
    border-radius: var(--r1); overflow: hidden;
    background: var(--surface); border: 1px solid var(--border);
  }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb-x {
    position: absolute; top: 2px; right: 2px;
    width: 18px; height: 18px; border-radius: 50%; border: none;
    background: rgba(0,0,0,.65); color: #fff;
    font-size: var(--fs-xs); font-weight: 800; line-height: 1;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .thumb-add {
    width: clamp(44px, 5vw, 56px); height: clamp(44px, 5vw, 56px);
    border-radius: var(--r1); border: 2px dashed var(--border2);
    background: var(--surface); color: var(--accent);
    font-size: var(--fs-xl); font-weight: 700; cursor: pointer;
  }
  .thumb-add:disabled { opacity: .35; cursor: not-allowed; }

  .mg-fields { display: grid; grid-template-columns: 52px 1fr 90px 72px; gap: var(--s2); }
  .mg-fields input, .mg-fields textarea {
    padding: var(--s2); font-size: var(--fs-md); font-family: inherit;
    border: 1px solid var(--border2); border-radius: var(--r1);
    background: var(--surface); min-width: 0; outline: none;
  }
  .mg-fields input:focus, .mg-fields textarea:focus { border-color: var(--accent); }
  .mg-fields input.emoji-in { text-align: center; font-size: var(--fs-lg); padding: var(--s1); }
  .mg-desc { grid-column: 1 / -1; }
  .mg-desc textarea { min-height: 44px; resize: vertical; }

  .mg-bottom { display: flex; justify-content: space-between; align-items: center; gap: var(--s2); }
  .mg-hint { font-size: var(--fs-xs); color: var(--muted); }
  .mg-actions { display: flex; gap: var(--s1); }
  .btn-save { background: var(--success); color: #fff; }
  .btn-save:hover { background: var(--success2); }
  .btn-del { background: #fbe3dd; color: var(--danger); }
  .btn-del:hover { background: #f7d2ca; }

  .item-row {
    background: var(--tint3); border: 1px solid var(--tint2);
    border-radius: var(--r2); padding: var(--s2) var(--s3);
    margin-bottom: var(--s2);
    display: flex; justify-content: space-between; align-items: center; gap: var(--s2);
    flex-wrap: wrap;
  }
  .item-main { flex: 1; min-width: 140px; }
  .item-title {
    font-size: var(--fs-md); font-weight: 700;
    display: flex; align-items: center; gap: var(--s1); flex-wrap: wrap;
  }
  .item-sub { font-size: var(--fs-xs); color: var(--muted); margin-top: 2px; }
  .item-actions { display: flex; gap: var(--s1); flex-wrap: wrap; }
  .tag {
    display: inline-block; background: var(--tint2); color: var(--accent3);
    font-size: 10px; font-weight: 800;
    padding: 1px var(--s2); border-radius: 999px;
  }
  .tag.green { background: #e8f6ea; color: var(--success2); }
  .tag.red   { background: #fbe3dd; color: var(--danger); }
  .tag.blue  { background: #e8f0ff; color: #1a5fc0; }
  .tag.gold  { background: #fff7d6; color: #8a6d00; }

  .promo-row { background: linear-gradient(135deg,#fff7d6,#ffe9b0); border: 1px solid #ffe1a0; }

  .settings-field { margin-bottom: var(--s3); }
  .settings-field label {
    display: block; font-size: var(--fs-sm); font-weight: 600;
    margin-bottom: var(--s1); color: #5a3e2e;
  }
  .settings-field input, .settings-field select, .settings-field textarea {
    width: 100%; padding: var(--s2) var(--s3);
    font-size: var(--fs-md); font-family: inherit;
    border: 1px solid var(--border2); border-radius: var(--r1);
    background: var(--surface); outline: none;
  }
  .settings-field input:focus, .settings-field select:focus, .settings-field textarea:focus { border-color: var(--accent); }
  .warning {
    background: #fff5f3; border: 1px solid #f7d2ca;
    color: var(--danger); font-size: var(--fs-xs);
    padding: var(--s2) var(--s3); border-radius: var(--r1);
    margin-top: var(--s1); display: none;
  }
  .warning.show { display: block; }
  .coord-row { display: flex; gap: var(--s2); }
  .coord-row input { flex: 1; }

  /* ---------- Receipt ---------- */
  .receipt-preview {
    background: var(--tint3); border: 1px dashed var(--border2);
    border-radius: var(--r2); padding: var(--s3);
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: var(--fs-xs); line-height: 1.6;
    white-space: pre-wrap; word-break: break-word;
    max-height: 260px; overflow-y: auto; color: #5a3e2e;
  }

  /* ---------- Viewer ---------- */
  .viewer { position: relative; max-width: 560px; width: 100%; }
  .viewer img { width: 100%; max-height: 78vh; object-fit: contain; border-radius: var(--r3); background: #111; display: block; }
  .viewer-nav {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 38px; height: 38px; border-radius: 50%; border: none;
    background: rgba(255,255,255,.9); color: var(--text);
    font-size: var(--fs-xl); font-weight: 700; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 14px rgba(0,0,0,.3);
  }
  .viewer-nav.prev { left: var(--s2); }
  .viewer-nav.next { right: var(--s2); }
  .viewer-close {
    position: absolute; top: -12px; right: -4px;
    width: 32px; height: 32px; border-radius: 50%; border: none;
    background: var(--surface); color: var(--text);
    font-size: var(--fs-lg); font-weight: 700; cursor: pointer;
    box-shadow: 0 4px 14px rgba(0,0,0,.3);
  }
  .viewer-count {
    text-align: center; color: #fff; font-weight: 700;
    font-size: var(--fs-xs); margin-top: var(--s2);
    text-shadow: 0 1px 4px rgba(0,0,0,.5);
  }

  /* ---------- Toast ---------- */
  .toast-wrap {
    position: fixed; bottom: calc(var(--s3) + env(safe-area-inset-bottom));
    left: 50%; transform: translateX(-50%); z-index: 2000;
    display: flex; flex-direction: column; gap: var(--s2); pointer-events: none;
  }
  .toast {
    background: var(--text); color: #fff;
    padding: var(--s2) var(--s3); border-radius: var(--r2);
    font-size: var(--fs-sm); font-weight: 600;
    box-shadow: 0 8px 24px rgba(0,0,0,.25);
    animation: slideUp .25s ease;
  }
  @keyframes slideUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

  /* ---------- Map ---------- */
  .map-wrapper { margin-top: var(--s3); }
  #map {
    height: clamp(220px, 26vw, 360px);
    border-radius: var(--r3); overflow: hidden;
    background: #f0e8df; box-shadow: var(--sh2);
  }
  .map-controls {
    display: flex; gap: var(--s2); margin-top: var(--s2); flex-wrap: wrap;
  }
  .map-controls button, .map-controls a {
    flex: 1; min-width: 130px;
    padding: var(--s2) var(--s3); font-size: var(--fs-sm);
    font-weight: 700; font-family: inherit; text-align: center;
    border: none; border-radius: var(--r2); cursor: pointer;
    text-decoration: none; transition: background .15s;
    display: inline-flex; align-items: center; justify-content: center; gap: var(--s1);
  }
  .map-controls button { background: var(--accent); color: #fff; }
  .map-controls button:hover { background: var(--accent2); }
  .map-controls button:disabled { background: #d9b8a0; cursor: not-allowed; }
  .map-controls a { background: var(--wa); color: #fff; }
  .map-controls a:hover { background: var(--wa2); }
  #route-info {
    margin-top: var(--s2); padding: var(--s2) var(--s3);
    border-radius: var(--r2); font-size: var(--fs-sm);
    font-weight: 600; text-align: center; display: none;
  }
  #route-info.success { display: block; background: #e8f6ea; color: var(--success2); }
  #route-info.error   { display: block; background: #fbe3dd; color: var(--danger); }
  #route-info.loading { display: block; background: var(--tint); color: var(--muted); }
  .leaflet-control-attribution { font-size: .65rem !important; }

  /* ============================================================
     MOBILE
     ============================================================ */
  @media (max-width: 900px) {
    body { padding: var(--s3) var(--s2) calc(88px + env(safe-area-inset-bottom)); }
    main { grid-template-columns: 1fr; gap: var(--s3); }
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s2); }
    .card { padding: var(--s2); gap: var(--s1); }
    #map { height: 220px; }

    aside {
      position: fixed; left: 0; right: 0; bottom: 0; top: auto;
      border-radius: var(--r3) var(--r3) 0 0;
      max-height: 82vh; overflow-y: auto;
      padding: var(--s3) var(--s3) calc(var(--s3) + env(safe-area-inset-bottom));
      transform: translateY(110%);
      transition: transform .3s cubic-bezier(.2,.8,.2,1);

      box-shadow: 0 -10px 34px rgba(60,35,20,.22);
    }
    aside.open { transform: translateY(0); }
    #cart-items { max-height: 34vh; }

    .drawer-close {

    }
    .drawer-backdrop.show { display: block; }

    .mobile-bar {
      display: none;
      position: fixed; left: var(--s2); right: var(--s2);

/* ============================================================
   PIN HASHING
   ============================================================ */
async function hashPin(pin) {
  const salted = "sc_v1_" + pin;
  if (window.crypto && window.crypto.subtle) {
    try {
      const buf = new TextEncoder().encode(salted);
      const digest = await crypto.subtle.digest("SHA-256", buf);
      return "sha_" + Array.from(new Uint8Array(digest))
        .map(b => b.toString(16).padStart(2, "0")).join("");
    } catch (_) {}
  }
  // Fallback for non-secure contexts (file://, plain http)
  let h1 = 5381, h2 = 0;
  for (let i = 0; i < salted.length; i++) {
    h1 = ((h1 << 5) + h1 + salted.charCodeAt(i)) | 0;
    h2 = ((h2 << 7) + h2 + salted.charCodeAt(i)) | 0;
  }
  return "fb_" + Math.abs(h1).toString(16) + Math.abs(h2).toString(16);
}

/* Console unlock state */

    + " · " + TZ;
}
function shortTimestamp(d) {
  return d.toLocaleString(undefined, { day:"numeric", month:"short", hour:"2-digit", minute:"2-digit" });

const COUNTRY_TO_CURRENCY = {

async function fetchJSON(url, ms) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), ms);
  try {
    const res = await fetch(url, { signal: ctrl.signal });
    if (!res.ok) throw new Error();
    return await res.json();
  } finally { clearTimeout(t); }
}
function regionFromLocale(loc) {
  if (!loc) return null;
  try {
    const max = new Intl.Locale(loc).maximize();
    if (max.region) return max.region;
  } catch (_) {}
  const m = String(loc).match(/[-_]([A-Za-z]{2})(?:$|[-_])/);
  return m ? m[1].toUpperCase() : null;
}
function money(usd) {
  const amount = usd * (rates[activeCurrency] || 1);
  try {
    return new Intl.NumberFormat(activeLocale, {
      style: "currency", currency: activeCurrency
    }).format(amount);
  } catch (_) {
    return activeCurrency + " " + Math.round(amount).toLocaleString();
  }
}
function buildCurrencySelect() {
  const sel = document.getElementById("currency-select");
  CURRENCY_OPTIONS.forEach(code => {
    const opt = document.createElement("option");
    opt.value = code; opt.textContent = code;
    sel.appendChild(opt);
  });
  sel.addEventListener("change", () => {
    activeCurrency = sel.value;
    settings.forceCurrency = sel.value;
    saveSettings();
    renderAll();
  });
}
function updateCurrencySelect() {
  const sel = document.getElementById("currency-select");
  if (![...sel.options].some(o => o.value === activeCurrency)) {
    const opt = document.createElement("option");
    opt.value = activeCurrency; opt.textContent = activeCurrency;
    sel.appendChild(opt);
  }
  sel.value = activeCurrency;
}
async function detectCurrency() {
  const region = regionFromLocale(navigator.language);
  if (region && COUNTRY_TO_CURRENCY[region]) activeCurrency = COUNTRY_TO_CURRENCY[region];
  updateCurrencySelect();
  renderAll();
  try {
    const geo = await fetchJSON("https://get.geojs.io/v1/ip/geo.json", 4000);
    if (geo && geo.country_code && COUNTRY_TO_CURRENCY[geo.country_code]) {
      activeCurrency = COUNTRY_TO_CURRENCY[geo.country_code];
    }
  } catch (_) {}
  try {
    const data = await fetchJSON("https://open.er-api.com/v6/latest/USD", 6000);
    if (data && data.rates) rates = { ...FALLBACK_RATES, ...data.rates };
  } catch (_) {}
  if (settings.forceCurrency && settings.forceCurrency !== "auto") {
    activeCurrency = settings.forceCurrency;
  }
  updateCurrencySelect();
  renderAll();
}

function beep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = 880;
    gain.gain.setValueAtTime(0.18, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
    osc.start(); osc.stop(ctx.currentTime + 0.35);
  } catch (_) {}
}

function parseKey(k) {
  const [id, kind] = String(k).split("|");
  return { id: Number(id), kind: kind === "q" ? "q" : "f" };
}
function unitPrice(p, kind) { return kind === "q" ? (p.quarterPrice || 0) : p.price; }
function cartTotalUSD() {
  return Object.keys(cart).reduce((s, k) => {
    const { id, kind } = parseKey(k);
    const p = products.find(x => x.id === id);
    return p ? s + unitPrice(p, kind) * cart[k] : s;
  }, 0);
}
function cartCount() { return Object.values(cart).reduce((a, b) => a + b, 0); }

  }
  const btn = e.target.closest("button[data-add]");
  if (!btn) return;
  const id   = Number(btn.dataset.id);
  const kind = btn.dataset.add === "q" ? "q" : "f";
  const p    = products.find(x => x.id === id);
  if (!p || (kind === "q" && !(p.quarterPrice > 0))) return;
  const key = id + "|" + kind;
  cart[key] = (cart[key] || 0) + 1;
  renderCart();
});

function renderCart() {
  statusEl.textContent = "";
  Object.keys(cart).forEach(k => {
    const { id, kind } = parseKey(k);
    const p = products.find(x => x.id === id);
    if (!p || (kind === "q" && !(p.quarterPrice > 0))) delete cart[k];
  });
  cartEl.innerHTML = "";
  const keys = Object.keys(cart);
  let total = 0, count = 0;

  keys.forEach(k => {
    const { id, kind } = parseKey(k);
    const p    = products.find(x => x.id === id);
    const qty  = cart[k];
    const line = unitPrice(p, kind) * qty;
    total += line; count += qty;

    const li = document.createElement("li");
    li.innerHTML = `
      <div class="ci-name">${escapeHTML(p.emoji)} ${escapeHTML(p.name)}${kind === "q" ? ' <span class="q-badge">¼</span>' : ""}</div>
      <div class="ci-row">
        <div class="qty">
          <button data-act="dec" data-k="${k}">−</button>
          <span>${qty}</span>
          <button data-act="inc" data-k="${k}">+</button>
        </div>
        <span class="ci-price">${money(line)}</span>
      </div>`;
    cartEl.appendChild(li);
  });

  totalEl.textContent = money(total);
  updateMobileBar(count, total);
  updateAlertBadge();
}

cartEl.addEventListener("click", e => {
  const btn = e.target.closest("button[data-act]");
  if (!btn) return;
  const k = btn.dataset.k;
  if (btn.dataset.act === "inc") cart[k] = (cart[k] || 0) + 1;
  else { cart[k]--; if (cart[k] <= 0) delete cart[k]; }
  renderCart();
});

function compressImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      let { width, height } = img;
      const scale = Math.min(1, PHOTO_MAX_DIM / Math.max(width, height));
      width  = Math.max(1, Math.round(width  * scale));
      height = Math.max(1, Math.round(height * scale));
      const canvas = document.createElement("canvas");
      canvas.width = width; canvas.height = height;
      canvas.getContext("2d").drawImage(img, 0, 0, width, height);
      try { resolve(canvas.toDataURL("image/jpeg", PHOTO_QUALITY)); }
      catch (err) { reject(err); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("bad image")); };
    img.src = url;
  });
}

   ============================================================ */
function detectNetwork(phone) {
  const d = String(phone || "").replace(/\D/g, "");
  if (/^(256)?0?7(0|4|5)/.test(d) || /^(256)?7(0|4|5)/.test(d)) return "Airtel";
  if (/^(256)?0?7(6|7|8)/.test(d) || /^(256)?7(6|7|8)/.test(d)) return "MTN";
  if (/^(256)?0?3(1|9)/.test(d) || /^(256)?3(1|9)/.test(d)) return "MTN";
  return "";
}
function ussdFor(network, amount, code) {
  const amt = Math.round(amount);
  if (network === "Airtel") return `*185*2*${code}*${amt}#`;
  if (network === "MTN")    return `*165*2*${code}*${amt}#`;
  return "";
}

    network = detected;
  }
  startPush(raw, custNameInput.value.trim(), saveCustomer.checked, network);
});

function startPush(phone, name, doSave, network) {
  paymentInProgress = true;
  payActions.style.display = "none";
  payProgress.classList.add("visible");
  progressText.textContent = "Sending " + (network === "MTN" ? "MTN request" : "Airtel request") + "…";
  setTimeout(() => {
    progressText.textContent = network === "MTN" ? "Approve on your phone…" : "Enter PIN on your phone…";
  }, 1500);
  setTimeout(() => {
    progressText.textContent = "Confirmed ✓";
    paymentInProgress = false;
    const ref = (network === "MTN" ? "MTN" : "AM") + "-" +
                Date.now().toString().slice(-6) + "-" +
                Math.floor(Math.random()*900000 + 100000);
    completeOrder(phone, name, doSave, network, ref);
  }, 3200);
}

function completeOrder(phone, name, doSave, network, ref) {
  const amount = cartTotalUSD();
  const items = Object.keys(cart).map(k => {
    const { id, kind } = parseKey(k);
    const p = products.find(x => x.id === id);
    return {
      name: p.name, emoji: p.emoji, qty: cart[k], kind,
      unitUSD: unitPrice(p, kind),
      lineUSD: unitPrice(p, kind) * cart[k]
    };
  });
  const orderId = "ORD-" + Date.now().toString().slice(-6);
  const order = {
    id: orderId, ts: Date.now(),
    customerPhone: phone, customerName: name || "",
    network, ref, items, totalUSD: amount,
    acknowledged: false, receiptSent: false
  };
  orders.unshift(order);
  saveOrders();
  lastOrder = order;

  if (doSave) saveCustomerRecord(phone, name);
  else if (!customers.some(c => c.phone === phone)) saveCustomerRecord(phone, name, false);

  Object.keys(cart).forEach(k => delete cart[k]);
  renderCart();

  setTimeout(() => {
    payModal.classList.remove("open");
    payProgress.classList.remove("visible");
    payActions.style.display = "flex";
    confirmPayBtn.disabled = false;
    showReceipt(order);
    newOrderAlert(order);
  }, 700);
}

function saveCustomerRecord(phone, name, promoOptIn = true) {
  const clean = String(phone).replace(/\s+/g, "");
  const existing = customers.find(c => c.phone === clean);
  if (existing) {
    existing.lastOrderAt = Date.now();
    existing.orderCount = (existing.orderCount || 0) + 1;
    if (promoOptIn) existing.promoOptIn = true;
    if (name && !existing.name) existing.name = name;
  } else {
    customers.push({
      phone: clean, name: name || "",
      promoOptIn, savedAt: Date.now(),
      lastOrderAt: Date.now(), orderCount: 1
    });
  }
  saveCustomers();
}

/* ============================================================
   RECEIPT
   ============================================================ */
function buildReceipt(order) {
  const lines = [];
  lines.push("🧾 *" + settings.storeName + "*");
  lines.push("📅 " + shortTimestamp(new Date(order.ts)));
  lines.push("🕐 " + TZ);
  lines.push("");
  lines.push("Order #" + order.id);
  lines.push("");
  order.items.forEach(it => {
    const lbl = it.kind === "q" ? " (¼)" : "";
    lines.push(`${it.qty}× ${it.emoji} ${it.name}${lbl} — ${money(it.lineUSD)}`);
  });
  lines.push("");
  lines.push(`*Total: ${money(order.totalUSD)}*`);
  lines.push("");
  lines.push(`💳 Paid via ${order.network}`);
  lines.push(`📱 ${maskPhone(order.customerPhone)}`);
  lines.push(`🔖 Ref: ${order.ref}`);
  if (order.customerName) lines.push(`👤 ${order.customerName}`);
  lines.push("");
  lines.push("Thank you! 🙏");
  return lines.join("\n");
}
function maskPhone(raw) {
  const d = String(raw || "").replace(/\D/g, "");
  if (d.length < 4) return raw;
  return d.slice(0, 3) + " •••• " + d.slice(-3);
}
function buildShopOrderText(order) {
  const lines = [`🍪 *NEW ORDER — ${settings.storeName}*`, ""];
  order.items.forEach(it => {
    const lbl = it.kind === "q" ? " (¼)" : "";
    lines.push(`• ${it.emoji} ${it.name}${lbl} × ${it.qty} — ${money(it.lineUSD)}`);
  });
  lines.push("", `*Total: ${money(order.totalUSD)}*`, "");
  lines.push(`📱 Customer: ${order.customerPhone}`);
  if (order.customerName) lines.push(`👤 ${order.customerName}`);
  lines.push(`💳 ${order.network} · ${order.ref}`);
  lines.push(`🕐 ${shortTimestamp(new Date(order.ts))} · ${TZ}`);
  return lines.join("\n");
}

/* ============================================================
   LOCK FLOW
   ============================================================ */
let lockMode = "enter";
let lockOnSuccess = null;
let lockSubmitting = false;

function openLockModal(mode, onSuccess) {
  lockMode = mode;
  lockOnSuccess = onSuccess || null;

  document.getElementById("lock-pin").value = "";
  document.getElementById("lock-pin2").value = "";
  document.getElementById("lock-old").value = "";
  document.getElementById("lock-error").textContent = "";

  const title     = document.getElementById("lock-title");
  const sub       = document.getElementById("lock-sub");
  const oldField  = document.getElementById("lock-old-field");
  const pinLabel  = document.getElementById("lock-pin-label");
  const pin2Field = document.getElementById("lock-pin2-field");
  const submit    = document.getElementById("lock-submit");

  if (mode === "set") {
    title.textContent = "🔒 Set seller PIN";
    sub.textContent = "Choose an 8-digit PIN. You'll need it to open the seller console.";
    oldField.style.display = "none";
    pinLabel.textContent = "New PIN";
    pin2Field.style.display = "block";
    submit.textContent = "Set PIN";
  } else if (mode === "change") {
    title.textContent = "🔒 Change PIN";
    sub.textContent = "Enter your current PIN, then choose a new one.";
    oldField.style.display = "block";
    pinLabel.textContent = "New PIN";
    pin2Field.style.display = "block";
    submit.textContent = "Update PIN";
  } else {
    title.textContent = "🔒 Seller console";
    sub.textContent = "Enter your 8-digit PIN.";
    oldField.style.display = "none";
    pinLabel.textContent = "PIN";
    pin2Field.style.display = "none";
    submit.textContent = "Unlock";
  }

  document.getElementById("lock-modal").classList.add("open");
  setTimeout(() => {
    if (mode === "change") document.getElementById("lock-old").focus();
    else document.getElementById("lock-pin").focus();
  }, 100);
}

["lock-pin", "lock-pin2", "lock-old"].forEach(id => {
  const el = document.getElementById(id);
  el.addEventListener("input", () => {
    el.value = el.value.replace(/\D/g, "").slice(0, 8);
  });
});

document.getElementById("lock-cancel").addEventListener("click", () => {
  document.getElementById("lock-modal").classList.remove("open");
});

document.getElementById("lock-submit").addEventListener("click", async () => {
  if (lockSubmitting) return;
  lockSubmitting = true;
  const errEl = document.getElementById("lock-error");
  errEl.textContent = "";

  try {
    const pin1 = document.getElementById("lock-pin").value;
    const pin2 = document.getElementById("lock-pin2").value;
    const old  = document.getElementById("lock-old").value;
    const stored = localStorage.getItem(K.pin);

    if (lockMode === "enter") {
      if (pin1.length !== 8) { errEl.textContent = "Enter exactly 8 digits"; return; }
      const hashed = await hashPin(pin1);
      if (hashed !== stored) {
        errEl.textContent = "Wrong PIN";
        document.getElementById("lock-pin").value = "";
        return;
      }
      unlockConsole();
      document.getElementById("lock-modal").classList.remove("open");
      if (lockOnSuccess) lockOnSuccess();

    } else if (lockMode === "set") {
      if (pin1.length !== 8) { errEl.textContent = "PIN must be exactly 8 digits"; return; }
      if (pin1 !== pin2)     { errEl.textContent = "PINs don't match"; return; }
      const hashed = await hashPin(pin1);
      localStorage.setItem(K.pin, hashed);
      unlockConsole();
      document.getElementById("lock-modal").classList.remove("open");
      toast("PIN set");
      if (lockOnSuccess) lockOnSuccess();

    } else if (lockMode === "change") {
      if (old.length !== 8) { errEl.textContent = "Enter your current PIN"; return; }
      const oldHash = await hashPin(old);
      if (oldHash !== stored) { errEl.textContent = "Current PIN is wrong"; return; }
      if (pin1.length !== 8)  { errEl.textContent = "New PIN must be exactly 8 digits"; return; }
      if (pin1 !== pin2)      { errEl.textContent = "PINs don't match"; return; }
      const newHash = await hashPin(pin1);
      localStorage.setItem(K.pin, newHash);
      document.getElementById("lock-modal").classList.remove("open");
      toast("PIN updated");
    }
  } finally {
    lockSubmitting = false;
  }
});

document.getElementById("lock-modal").addEventListener("keydown", e => {

    e.preventDefault();
    document.getElementById("lock-submit").click();
  }
});

function priceHint(price, q) {
  const parts = [];
  if (isFinite(price) && price > 0) parts.push("Full " + money(price));
  if (isFinite(q) && q > 0)         parts.push("¼ " + money(q));
  return parts.join(" · ") || "—";
}

function renderConsoleItems() {
  consoleItems.innerHTML = "";
  if (!products.length) {
    consoleItems.innerHTML = '<div class="list-empty">No items yet — add one below</div>';
    return;
  }
  products.forEach(p => {

    row.dataset.id = p.id;

    const thumbs = p.photos.map((src, i) =>
      `<div class="thumb">
         <img src="${src}" alt="" loading="lazy">
         <button class="thumb-x" data-rm-photo="${p.id}" data-i="${i}" aria-label="Remove">×</button>
       </div>`
    ).join("");
    const full = p.photos.length >= MAX_PHOTOS;

    row.innerHTML = `
      <div class="mg-photos">
        ${thumbs}
        <button class="thumb-add" data-add-photo="${p.id}" ${full ? "disabled" : ""} aria-label="Add photo">＋</button>
      </div>
      <div class="mg-fields">
        <input class="emoji-in" data-f="emoji" maxlength="4" value="${escapeAttr(p.emoji)}" aria-label="Emoji">
        <input data-f="name" value="${escapeAttr(p.name)}" aria-label="Name">
        <input data-f="price" type="number" min="0.01" step="0.01" value="${p.price.toFixed(2)}" aria-label="Price">

        <textarea class="mg-desc" data-f="desc" placeholder="Description" aria-label="Description">${escapeHTML(p.desc || "")}</textarea>
      </div>

        <div class="mg-hint">${priceHint(p.price, p.quarterPrice)}</div>
        <div class="mg-actions">
          <button class="btn-sm btn-save" data-act="save" data-id="${p.id}">Save</button>
          <button class="btn-sm btn-del" data-act="del" data-id="${p.id}">×</button>
        </div>
      </div>`;

  });
}

consoleItems.addEventListener("input", e => {

  const row  = input.closest(".mg-row");
  const hint = row.querySelector(".mg-hint");

consoleItems.addEventListener("click", e => {
  const addBtn = e.target.closest("[data-add-photo]");
  if (addBtn) {
    pendingPhotoTarget = Number(addBtn.dataset.addPhoto);
    photoInput.value = "";
    photoInput.click();
    return;
  }
  const rmBtn = e.target.closest("[data-rm-photo]");
  if (rmBtn) {
    const p = products.find(x => x.id === Number(rmBtn.dataset.rmPhoto));
    if (p) {
      p.photos.splice(Number(rmBtn.dataset.i), 1);
      saveProducts(); renderConsoleItems(); renderMenu();
    }
    return;
  }
  const btn = e.target.closest("button[data-act]");
  if (!btn) return;
  const id  = Number(btn.dataset.id);
  const row = btn.closest(".mg-row");

  if (btn.dataset.act === "save") {
    const emoji = row.querySelector('[data-f="emoji"]').value.trim() || "🍪";
    const name  = row.querySelector('[data-f="name"]').value.trim();
    const price = parseFloat(row.querySelector('[data-f="price"]').value);
    const qRaw  = parseFloat(row.querySelector('[data-f="quarter"]').value);
    const desc  = row.querySelector('[data-f="desc"]').value.trim();

    if (!name) { toast("Name required"); return; }
    if (!isFinite(price) || price <= 0) { toast("Price must be > 0"); return; }

    const p = products.find(x => x.id === id);
    if (!p) return;
    p.emoji = emoji.slice(0, 4);
    p.name  = name;
    p.desc  = desc;
    p.price = Math.round(price * 100) / 100;
    p.quarterPrice = (isFinite(qRaw) && qRaw > 0) ? Math.round(qRaw * 100) / 100 : 0;
    saveProducts();
    renderConsoleItems(); renderMenu(); renderCart();
    toast("Item saved");
  }
  if (btn.dataset.act === "del") {
    const p = products.find(x => x.id === id);
    if (!p) return;
    if (!confirm(`Delete "${p.name}"?`)) return;
    products = products.filter(x => x.id !== id);
    Object.keys(cart).forEach(k => { if (parseKey(k).id === id) delete cart[k]; });
    saveProducts();
    renderConsoleItems(); renderMenu(); renderCart();
  }
});

photoInput.addEventListener("change", async () => {
  if (pendingPhotoTarget == null) return;
  const p = products.find(x => x.id === pendingPhotoTarget);
  pendingPhotoTarget = null;
  if (!p) return;
  const slots = MAX_PHOTOS - p.photos.length;
  const files = [...photoInput.files].slice(0, Math.max(0, slots));
  if (!files.length) return;
  try {
    for (const f of files) {
      if (!f.type.startsWith("image/")) continue;
      p.photos.push(await compressImage(f));
    }
    saveProducts(); renderConsoleItems(); renderMenu();
  } catch (_) { toast("Could not add photo"); }
});

    if (!o.acknowledged) row.style.borderLeft = "4px solid var(--danger)";
    row.innerHTML = `
      <div class="item-main">
        <div class="item-title">
          🧾 ${o.id}
          ${!o.acknowledged ? '<span class="tag red">New</span>' : '<span class="tag green">Done</span>'}
          <span class="tag">${o.network}</span>
        </div>
        <div class="item-sub">
          ${shortTimestamp(new Date(o.ts))} · ${money(o.totalUSD)} · ${o.items.length} item(s)<br>
          📱 ${escapeHTML(o.customerPhone)}${o.customerName ? ' · ' + escapeHTML(o.customerName) : ''}
        </div>
      </div>
      <div class="item-actions">
        <button class="btn-sm btn-wa" data-receipt="${o.id}">🧾 Receipt</button>
        ${!o.acknowledged ? `<button class="btn-sm btn-save" data-ack="${o.id}">✓ Done</button>` : ''}
        <button class="btn-sm btn-del" data-delorder="${o.id}">×</button>
      </div>`;
    consoleOrders.appendChild(row);
  });
}
consoleOrders.addEventListener("click", e => {
  const rBtn = e.target.closest("[data-receipt]");
  if (rBtn) {
    const o = orders.find(x => x.id === rBtn.dataset.receipt);
    if (o) openWhatsApp(o.customerPhone, buildReceipt(o));
    return;
  }
  const aBtn = e.target.closest("[data-ack]");
  if (aBtn) {
    const o = orders.find(x => x.id === aBtn.dataset.ack);
    if (o) { o.acknowledged = true; saveOrders(); renderConsoleOrders(); updateAlertBadge(); }
    return;
  }
  const dBtn = e.target.closest("[data-delorder]");
  if (dBtn) {
    if (!confirm("Delete this order record?")) return;
    orders = orders.filter(o => o.id !== dBtn.dataset.delorder);
    saveOrders();
    renderConsoleOrders();
    updateAlertBadge();
  }
});

/* ---------- PROMOS TAB ---------- */
const consolePromos = document.getElementById("console-promos");
function renderConsolePromos() {
  consolePromos.innerHTML = "";
  if (!settings.promos || !settings.promos.length) {
    consolePromos.innerHTML = '<div class="list-empty">No promotions yet — add one below</div>';
    return;
  }
  settings.promos.forEach(p => {
    const row = document.createElement("div");
    row.className = "item-row promo-row";
    row.innerHTML = `
      <div class="item-main">
        <div class="item-title">
          📣 ${escapeHTML(p.title)}
          ${p.active ? '<span class="tag green">Active</span>' : '<span class="tag">Paused</span>'}
        </div>
        <div class="item-sub">${escapeHTML(p.message)}</div>
      </div>
      <div class="item-actions">
        <button class="btn-sm btn-wa" data-broadcast="${p.id}">📤 Broadcast</button>
        <button class="btn-sm" style="background:var(--tint2);color:var(--accent3);" data-toggle-promo="${p.id}">${p.active ? 'Pause' : 'Activate'}</button>
        <button class="btn-sm btn-del" data-delpromo="${p.id}">×</button>
      </div>`;
    consolePromos.appendChild(row);
  });
}
consolePromos.addEventListener("click", e => {
  const bBtn = e.target.closest("[data-broadcast]");
  if (bBtn) {
    const p = settings.promos.find(x => x.id === Number(bBtn.dataset.broadcast));
    if (!p) return;
    const recipients = customers.filter(c => c.promoOptIn);
    if (!recipients.length) { toast("No opted-in customers"); return; }
    if (!confirm(`Send "${p.title}" to ${recipients.length} customer(s) on WhatsApp?`)) return;
    const text = `📣 *${settings.storeName}*\n\n*${p.title}*\n${p.message}`;
    recipients.forEach((c, i) => {
      setTimeout(() => openWhatsApp(c.phone, text), i * 800);
    });
    toast("Opening WhatsApp for " + recipients.length + " customer(s)");
    return;
  }
  const tBtn = e.target.closest("[data-toggle-promo]");
  if (tBtn) {
    const p = settings.promos.find(x => x.id === Number(tBtn.dataset.togglePromo));
    if (p) { p.active = !p.active; saveSettings(); renderConsolePromos(); renderPromoStrip(); }
    return;
  }
  const dBtn = e.target.closest("[data-delpromo]");
  if (dBtn) {
    if (!confirm("Delete this promotion?")) return;
    settings.promos = settings.promos.filter(p => p.id !== Number(dBtn.dataset.delpromo));
    saveSettings();
    renderConsolePromos(); renderPromoStrip();
  }
});

document.getElementById("add-promo").addEventListener("click", () => {
  const title = document.getElementById("new-promo-title").value.trim();
  const msg   = document.getElementById("new-promo-msg").value.trim();
  document.getElementById("promo-error").textContent = "";
  if (!title || !msg) { document.getElementById("promo-error").textContent = "Title and message required"; return; }
  settings.promos = settings.promos || [];
  settings.promos.push({ id: Date.now(), title, message: msg, active: true });
  saveSettings();
  document.getElementById("new-promo-title").value = "";
  document.getElementById("new-promo-msg").value = "";
  renderConsolePromos(); renderPromoStrip();
  toast("Promotion added");
});

/* ============================================================
   MAP
   ============================================================ */
let map, shopMarker, userMarker, routeLine;
let mapInitialized = false;

function getShopCoords() {
  return [settings.shopLat ?? DEFAULT_SETTINGS.shopLat, settings.shopLng ?? DEFAULT_SETTINGS.shopLng];
}

function initMap() {
  if (mapInitialized) return;
  mapInitialized = true;
  const coords = getShopCoords();
  map = L.map("map").setView(coords, 14);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19, attribution: '&copy; OpenStreetMap'
  }).addTo(map);
  shopMarker = L.marker(coords).addTo(map)
    .bindPopup(`<b>${escapeHTML(settings.storeName)}</b>`);
  updateGmapsLink();
  window.addEventListener("resize", () => { if (map) map.invalidateSize(); });
}

function updateGmapsLink() {
  const [lat, lng] = getShopCoords();
  document.getElementById("gmaps-link").href =
    `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`;
}

function refreshShopMarker() {
  if (!map || !shopMarker) return;
  const coords = getShopCoords();
  shopMarker.setLatLng(coords);
  shopMarker.setPopupContent(`<b>${escapeHTML(settings.storeName)}</b>`);
  map.setView(coords, map.getZoom() || 14);
  updateGmapsLink();
  if (routeLine) { map.removeLayer(routeLine); routeLine = null; }
  if (userMarker) { map.removeLayer(userMarker); userMarker = null; }
  const info = document.getElementById("route-info");
  info.className = ""; info.textContent = "";
}

function haversine([lat1, lon1], [lat2, lon2]) {
  const R = 6371000, toRad = d => d * Math.PI / 180;
  const dLat = toRad(lat2 - lat1), dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon/2)**2;
  return 2 * R * Math.asin(Math.sqrt(a));
}

async function fetchRoute(from, to) {
  try {
    const url = `https://router.project-osrm.org/route/v1/driving/${from[1]},${from[0]};${to[1]},${to[0]}?overview=full&geometries=geojson`;
    const res = await fetch(url);
    if (!res.ok) throw new Error("OSRM " + res.status);
    const data = await res.json();
    if (data.code !== "Ok" || !data.routes || !data.routes.length) throw new Error("No route");
    return { ...data.routes[0], isFallback: false };
  } catch (e) {
    const dist = haversine(from, to);
    return {
      geometry: { coordinates: [[from[1], from[0]], [to[1], to[0]]] },
      distance: dist,
      duration: dist / 10,
      isFallback: true
    };
  }
}

async function locateAndRoute() {
  const btn = document.getElementById("locate-btn");
  const info = document.getElementById("route-info");

  if (!navigator.geolocation) {
    info.className = "route-info error";
    info.textContent = "Geolocation is not supported in this browser";
    return;
  }
  if (!map) initMap();

  btn.disabled = true;
  btn.textContent = "📡 Locating…";
  info.className = "route-info loading";
  info.textContent = "Requesting your location…";

  navigator.geolocation.getCurrentPosition(
    async pos => {
      try {
        const userCoords = [pos.coords.latitude, pos.coords.longitude];
        if (userMarker) map.removeLayer(userMarker);
        userMarker = L.circleMarker(userCoords, {
          radius: 8, color: "#2c7be5", fillColor: "#2c7be5",
          fillOpacity: 0.9, weight: 3
        }).addTo(map).bindPopup("You are here");

        info.textContent = "Calculating route…";

        const route = await fetchRoute(userCoords, getShopCoords());
        const coords = route.geometry.coordinates.map(c => [c[1], c[0]]);

        if (routeLine) map.removeLayer(routeLine);
        routeLine = L.polyline(coords, {
          color: route.isFallback ? "#8a6d00" : "#c96a3a",
          weight: 5,
          opacity: 0.85,
          dashArray: route.isFallback ? "8 8" : null
        }).addTo(map);

        map.fitBounds(routeLine.getBounds(), { padding: [30, 30] });

        const dist = route.distance;
        const dur = route.duration;
        const distText = dist < 1000 ? Math.round(dist) + " m" : (dist/1000).toFixed(1) + " km";
        const durText = dur < 60 ? Math.round(dur) + " s" : Math.round(dur/60) + " min";

        info.className = "route-info success";
        info.innerHTML = (route.isFallback ? "⚠ Road route unavailable — straight-line: " : "") +
          `🚗 <b>${distText}</b> · ⏱ <b>${durText}</b>`;
      } catch (e) {
        info.className = "route-info error";
        info.textContent = "Couldn't calculate route: " + e.message;
      }
      btn.disabled = false;
      btn.textContent = "📍 Directions";
    },
    err => {
      let msg = "Location error";
      if (err.code === 1) msg = "Location permission denied. Enable in browser settings.";
      else if (err.code === 2) msg = "Location unavailable. Check GPS signal.";
      else if (err.code === 3) msg = "Location request timed out. Try again.";
      info.className = "route-info error";
      info.textContent = msg;
      btn.disabled = false;
      btn.textContent = "📍 Directions";
    },
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
  );
}

document.getElementById("locate-btn").addEventListener("click", locateAndRoute);
